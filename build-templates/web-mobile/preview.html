<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>茸茸庭院 · 高清竖屏预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1e8}
iframe{display:block;position:absolute;left:50%;top:50%;border:0;width:1080px;height:1920px;transform-origin:center;background:#dce8ce;box-shadow:0 0 50px #425b5025}
#zoom{position:fixed;right:12px;top:12px;z-index:9;border:1px solid #c8b99a;border-radius:10px;background:#fff9ed;color:#573d2d;padding:10px 14px;cursor:pointer;font-weight:bold}
body.native{overflow:auto}body.native iframe{left:0;top:0;transform:none!important}
</style>
</head>
<body>
<button id="zoom">查看1:1原始清晰度</button>
<iframe src="./index.html?v=hd35" title="1080×1920 高清竖屏游戏" allow="autoplay;fullscreen"></iframe>
<script>
const frame=document.querySelector('iframe');
function fit(){const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);frame.style.transform='translate(-50%,-50%) scale('+scale+')';}
window.addEventListener('resize',fit);fit();
document.querySelector('#zoom').onclick=function(){const native=document.body.classList.toggle('native');this.textContent=native?'返回适应窗口':'查看1:1原始清晰度';if(!native)fit();};
</script>
</body>
</html>
